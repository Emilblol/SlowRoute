plugins {
    id 'com.android.application'
}

android {
    namespace 'dk.slowroute'
    compileSdk 34

    defaultConfig {
        applicationId "dk.slowroute"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}
